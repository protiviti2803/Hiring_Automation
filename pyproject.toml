description = "FastAPI web application for JD generation using Groq API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.28.0",
    "groq>=0.9.0",
    "openai",
    "python-dotenv>=1.0.1",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.18",
    "scikit-learn>=1.4.0",
]
