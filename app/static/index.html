<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protiviti Resume Analyzer Portal</title>
    <!-- Base minimal stylesheet for keyframes and scrolls -->
    <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body class="bg-[#0a0f1c] text-[#e2e8f0] min-h-screen overflow-hidden">

    <!-- React App Container Mount -->
    <div id="root" class="w-full h-screen"></div>

    <!-- Core React, Babel & Tailwind CDN Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configure Tailwind play CDN theme extensions -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oxfordBlue: '#002147',
                        violetDark: '#502D55',
                        violetMuted: '#935073',
                        peachAccent: '#F6DBC0',
                        creamText: '#F8F4E9',
                    }
                }
            }
        }
    </script>

    <!-- Modularized React Components Script -->
    <script type="text/babel" src="/static/script.js?v=23"></script>
</body>
</html>
